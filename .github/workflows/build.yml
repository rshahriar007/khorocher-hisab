  // ইন-বিল্ট ক্যালকুলেটর ডায়ালগ
  void _openCalculatorDialog(BuildContext context, TextEditingController targetController) {
    String currentInput = targetController.text.isEmpty ? '0' : targetController.text;
    double firstOperand = 0;
    String operator = '';
    bool shouldReset = false;

    showDialog(
      context: context,
      builder: (calcCtx) {
        return StatefulBuilder(
          builder: (context, setCalcState) {
            void buttonPressed(String text) {
              setCalcState(() {
                if (text == 'C') {
                  currentInput = '0';
                  firstOperand = 0;
                  operator = '';
                } else if (text == '⌫') {
                  if (currentInput.length > 1) {
                    currentInput = currentInput.substring(0, currentInput.length - 1);
                  } else {
                    currentInput = '0';
                  }
                } else if (text == '+' || text == '-' || text == '×' || text == '÷') {
                  firstOperand = double.tryParse(currentInput) ?? 0;
                  operator = text;
                  shouldReset = true;
                } else if (text == '=') {
                  double secondOperand = double.tryParse(currentInput) ?? 0;
                  double res = 0;
                  if (operator == '+') res = firstOperand + secondOperand;
                  if (operator == '-') res = firstOperand - secondOperand;
                  if (operator == '×') res = firstOperand * secondOperand;
                  if (operator == '÷') res = secondOperand != 0 ? firstOperand / secondOperand : 0;

                  currentInput = res % 1 == 0 ? res.toInt().toString() : res.toStringAsFixed(2);
                  operator = '';
                  shouldReset = true;
                } else {
                  if (currentInput == '0' || shouldReset) {
                    currentInput = text;
                    shouldReset = false;
                  } else {
                    currentInput += text;
                  }
                }
              });
            }

            Widget calcButton(String text, {Color? bg, Color? fg}) {
              return Expanded(
                child: Padding(
                  padding: const EdgeInsets.all(4.0),
                  child: ElevatedButton(
                    style: ElevatedButton.styleFrom(
                      backgroundColor: bg ?? Colors.white,
                      foregroundColor: fg ?? Colors.black87,
                      shape: RoundedRectangleBorder(borderRadius: BorderRadius.circular(14)),
                      padding: const EdgeInsets.symmetric(vertical: 14),
                      elevation: 1,
                    ),
                    onPressed: () => buttonPressed(text),
                    child: Text(text, style: const TextStyle(fontSize: 18, fontWeight: FontWeight.bold)),
                  ),
                ),
              );
            }

            return AlertDialog(
              backgroundColor: const Color(0xFFF3F5F8),
              shape: RoundedRectangleBorder(borderRadius: BorderRadius.circular(24)),
              title: const Text('ক্যালকুলেটর', style: TextStyle(fontWeight: FontWeight.bold, fontSize: 18)),
              content: Column(
                mainAxisSize: MainAxisSize.min,
                children: [
                  Container(
                    width: double.infinity,
                    padding: const EdgeInsets.symmetric(vertical: 14, horizontal: 16),
                    decoration: BoxDecoration(
                      color: Colors.white,
                      borderRadius: BorderRadius.circular(16),
                    ),
                    alignment: Alignment.centerRight,
                    child: Text(
                      currentInput,
                      style: const TextStyle(fontSize: 28, fontWeight: FontWeight.bold, color: Colors.black87),
                    ),
                  ),
                  const SizedBox(height: 12),
                  Row(
                    children: [
                      calcButton('C', bg: const Color(0xFFFFEBEE), fg: Colors.red),
                      calcButton('⌫', bg: const Color(0xFFECEFF1)),
                      calcButton('÷', bg: const Color(0xFFFFE8B8), fg: const Color(0xFFB46200)),
                      calcButton('×', bg: const Color(0xFFFFE8B8), fg: const Color(0xFFB46200)),
                    ],
                  ),
                  Row(
                    children: [
                      calcButton('7'),
                      calcButton('8'),
                      calcButton('9'),
                      calcButton('-', bg: const Color(0xFFFFE8B8), fg: const Color(0xFFB46200)),
                    ],
                  ),
                  Row(
                    children: [
                      calcButton('4'),
                      calcButton('5'),
                      calcButton('6'),
                      calcButton('+', bg: const Color(0xFFFFE8B8), fg: const Color(0xFFB46200)),
                    ],
                  ),
                  Row(
                    children: [
                      calcButton('1'),
                      calcButton('2'),
                      calcButton('3'),
                      calcButton('=', bg: const Color(0xFF1B2028), fg: Colors.white),
                    ],
                  ),
                  Row(
                    children: [
                      calcButton('0'),
                      calcButton('.'),
                    ],
                  ),
                ],
              ),
              actions: [
                TextButton(
                  onPressed: () => Navigator.pop(calcCtx),
                  child: const Text('বাতিল', style: TextStyle(color: Colors.grey)),
                ),
                ElevatedButton(
                  style: ElevatedButton.styleFrom(
                    backgroundColor: const Color(0xFF2E7D32),
                    shape: RoundedRectangleBorder(borderRadius: BorderRadius.circular(12)),
                  ),
                  onPressed: () {
                    targetController.text = currentInput;
                    Navigator.pop(calcCtx);
                  },
                  child: const Text('টাকায় বসান', style: TextStyle(color: Colors.white)),
                ),
              ],
            );
          },
        );
      },
    );
  }

