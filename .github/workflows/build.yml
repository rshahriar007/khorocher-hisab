name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Setup and Build
        run: |
          mkdir app_temp
          cd app_temp
          flutter create --org com.khorocher.hisab app
          cd app
          
          # Add shared_preferences for local storage
          flutter pub add shared_preferences
          
          # Replace code
          cp ../../app_code.dart lib/main.dart
          
          # Update App Name cleanly using Python (encodes Bangla properly)
          python3 -c "
          manifest = 'android/app/src/main/AndroidManifest.xml'
          with open(manifest, 'r', encoding='utf-8') as f:
              content = f.read()
          content = content.replace('android:label=\"app\"', 'android:label=\"খরচের হিসাব\"')
          with open(manifest, 'w', encoding='utf-8') as f:
              f.write(content)
          "
          
          # Set App Icon if logo exists
          python3 -c "
          import os, shutil
          if os.path.exists('../../logo.png'):
              res_dir = 'android/app/src/main/res'
              for folder in os.listdir(res_dir):
                  if folder.startswith('mipmap-'):
                      target = os.path.join(res_dir, folder, 'ic_launcher.png')
                      shutil.copyfile('../../logo.png', target)
          "
          
          # Build APK
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk ../../khorocher-hisab.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: khorocher-hisab-apk
          path: khorocher-hisab.apk
