enum TransactionType { income, expense, receivable, payable }

class TransactionModel {
  String id;
  String title;
  String date;
  String? dueDate;
  double amount;
  TransactionType type;
  String avatarText;
  int avatarColorValue;

  TransactionModel({
    required this.id,
    required this.title,
    required this.date,
    this.dueDate,
    required this.amount,
    required this.type,
    required this.avatarText,
    required this.avatarColorValue,
  });

  Map<String, dynamic> toMap() {
    return {
      'id': id,
      'title': title,
      'date': date,
      'dueDate': dueDate,
      'amount': amount,
      'type': type.index,
      'avatarText': avatarText,
      'avatarColorValue': avatarColorValue,
    };
  }

  factory TransactionModel.fromMap(Map<String, dynamic> map) {
    return TransactionModel(
      id: map['id'],
      title: map['title'],
      date: map['date'],
      dueDate: map['dueDate'],
      amount: (map['amount'] as num).toDouble(),
      type: TransactionType.values[map['type']],
      avatarText: map['avatarText'],
      avatarColorValue: map['avatarColorValue'],
    );
  }
}

class MainNavigationScreen extends StatefulWidget {
  const MainNavigationScreen({super.key});

  @override
  State<MainNavigationScreen> createState() => _MainNavigationScreenState();
}

class _MainNavigationScreenState extends State<MainNavigationScreen> {
  int _currentIndex = 0;
  bool _isLoading = true;

  double totalBalance = 0.0;
  double todayExpense = 0.0;
  double totalReceivable = 0.0;
  double totalPayable = 0.0;

  List<TransactionModel> transactions = [];

  @override
  void initState() {
    super.initState();
    _loadDataFromLocal();
  }

  // ফোন মেমোরি থেকে ডেটা লোড করা
  Future<void> _loadDataFromLocal() async {
    final prefs = await SharedPreferences.getInstance();
    final String? rawData = prefs.getString('saved_transactions');
    if (rawData != null) {
      final List<dynamic> decoded = jsonDecode(rawData);
      transactions = decoded.map((item) => TransactionModel.fromMap(item)).toList();
      _calculateTotals();
    }
    setState(() {
      _isLoading = false;
    });
  }

  // ফোন মেমোরিতে ডেটা স্থায়ীভাবে সংরক্ষণ করা
  Future<void> _saveDataToLocal() async {
    final prefs = await SharedPreferences.getInstance();
    final List<Map<String, dynamic>> rawList = transactions.map((t) => t.toMap()).toList();
    await prefs.setString('saved_transactions', jsonEncode(rawList));
  }

  void _calculateTotals() {
    double bal = 0.0;
    double tExp = 0.0;
    double rec = 0.0;
    double pay = 0.0;

    final todayStr = '${DateTime.now().day}/${DateTime.now().month}/${DateTime.now().year}';

    for (var t in transactions) {
      if (t.type == TransactionType.income) {
        bal += t.amount;
      } else if (t.type == TransactionType.expense) {
        bal -= t.amount;
        if (t.date.contains(todayStr)) {
          tExp += t.amount;
        }
      } else if (t.type == TransactionType.receivable) {
        rec += t.amount;
      } else if (t.type == TransactionType.payable) {
        pay += t.amount;
      }
    }

    setState(() {
      totalBalance = bal;
      todayExpense = tExp;
      totalReceivable = rec;
      totalPayable = pay;
    });
  }

  void _addTransaction(String title, double amount, TransactionType type, {String? dueDate}) {
    String defaultTitle = '';
    int colorVal = 0xFFC7E2D8;

    if (type == TransactionType.expense) {
      defaultTitle = 'অন্যান্য খরচ';
      colorVal = 0xFFFFD4C2;
    } else if (type == TransactionType.income) {
      defaultTitle = 'অন্যান্য আয়';
    } else if (type == TransactionType.receivable) {
      defaultTitle = 'পাওনা হিসাব';
      colorVal = 0xFFD4E6F1;
    } else {
      defaultTitle = 'দেনা হিসাব';
      colorVal = 0xFFFFE8B8;
    }

    final now = DateTime.now();
    final currentDateStr = 'লেনদেন: ${now.day}/${now.month}/${now.year}';

    final newItem = TransactionModel(
      id: DateTime.now().millisecondsSinceEpoch.toString(),
      title: title.isEmpty ? defaultTitle : title,
      date: currentDateStr,
      dueDate: dueDate,
      amount: amount,
      type: type,
      avatarText: title.isNotEmpty ? title.characters.first : 'হি',
      avatarColorValue: colorVal,
    );

    setState(() {
      transactions.insert(0, newItem);
      _calculateTotals();
    });
    _saveDataToLocal();
  }

  void _deleteTransaction(TransactionModel item) {
    setState(() {
      transactions.removeWhere((t) => t.id == item.id);
      _calculateTotals();
    });
    _saveDataToLocal();

    ScaffoldMessenger.of(context).showSnackBar(
      SnackBar(
        content: Text('${item.title} মুছে ফেলা হয়েছে'),
        behavior: SnackBarBehavior.floating,
        shape: RoundedRectangleBorder(borderRadius: BorderRadius.circular(12)),
        duration: const Duration(seconds: 2),
      ),
    );
  }

