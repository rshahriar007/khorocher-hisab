name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Create and Setup App
        run: |
          mkdir app_temp
          cd app_temp
          flutter create --org com.khorocher.hisab app
          cd app
          cp ../../app_code.dart lib/main.dart
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk ../../khorocher-hisab.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: khorocher-hisab-apk
          path: khorocher-hisab.apk
